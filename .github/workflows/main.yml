name: Build Cashew IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install # Cashew uses npm, not pnpm

      - name: Build Web App
        run: npm run build

      - name: Generate iOS Project
        run: |
          npm install @capacitor/ios @capacitor/core @capacitor/cli
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -archivePath App.xcarchive archive \
                     CODE_SIGNING_ALLOWED=NO
          
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r Cashew.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cashew-IPA
          path: Cashew.ipa
