name: Build Cashew IPA (Flutter)
on: [push]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: budget # This is where the actual code lives

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0' # Adjust if the app requires a specific version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (No Signing)
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA (Manual Wrapper)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Cashew.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cashew-iOS-App
          path: budget/Cashew.ipa
