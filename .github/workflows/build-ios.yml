name: Build iOS IPA (Unsigned)

# This allows you to run the build manually from the Actions tab
on:
  workflow_dispatch:

jobs:
  build-ios:
    # Uses GitHub's free Mac servers
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6' # The exact version that fixes your Dart SDK error!
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd budget
          flutter pub get

      - name: Build unsigned iOS app
        run: |
          cd budget
          # Builds the raw iOS app without requiring Apple Developer certificates
          flutter build ios --release --no-codesign

      - name: Package into .ipa for Sideloading
        run: |
          cd budget/build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Cashew.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cashew-iOS-App
          path: budget/build/ios/iphoneos/Cashew.ipa
